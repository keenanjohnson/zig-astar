name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Run tests
        run: zig build test
      - name: Build example
        run: zig build example

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build and install kcov
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-dev libcurl4-openssl-dev libdw-dev libiberty-dev zlib1g-dev cmake build-essential
          git clone --depth 1 https://github.com/SimonKagstrom/kcov.git /tmp/kcov
          cmake -S /tmp/kcov -B /tmp/kcov/build
          cmake --build /tmp/kcov/build --parallel
          sudo cmake --install /tmp/kcov/build
      - name: Build test binary
        run: |
          mkdir -p zig-out
          zig test src/astar.zig --test-no-exec -femit-bin=zig-out/astar-test
      - name: Measure coverage
        run: kcov --include-pattern=src/ zig-out/coverage zig-out/astar-test
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: zig-out/coverage
